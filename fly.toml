# Fly.io configuration — see README.md → "Deploying to Fly.io".
app = "amirsiadat-blog"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_URL = "file:/app/data/blog.db"
  UPLOAD_DIR = "/app/data/uploads"
  # Public URL (canonical links, sitemap, RSS). Change it when you add a custom domain.
  SITE_URL = "https://amirsiadat-blog.fly.dev"
  SITE_TIMEZONE = "UTC"

# SQLite database + uploaded images. A volume attaches to a single machine, so this app must run
# exactly one machine (deploy with --ha=false; never scale above 1).
[[mounts]]
  source = "blog_data"
  destination = "/app/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep the single machine running: a cold start also runs migrations and the seed check.
  # Set to "stop" / 0 to save money at the cost of a few seconds on the first request.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
